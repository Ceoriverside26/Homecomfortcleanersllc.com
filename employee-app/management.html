<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Home Comfort Management</title><style>:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#f6f7f9;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;--green:#139a69;--yellow:#b7791f;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button{font:inherit}.wrap{max-width:1100px;margin:auto;padding:24px 16px 50px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:5px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-weight:750}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.lab{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.07em}.big{font-size:25px;font-weight:850;margin-top:7px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr .7fr 1fr;gap:12px;align-items:center}.name{font-weight:850}.small{font-size:12px;color:var(--muted)}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#f3f4f6}.approved{background:#e9f8f1;color:var(--green)}.review{background:#fff7e6;color:var(--yellow)}.actions{display:flex;gap:7px;flex-wrap:wrap}.approve,.flag{border:0;border-radius:9px;padding:8px 10px;font-weight:800;font-size:12px}.approve{background:#e9f8f1;color:var(--green)}.flag{background:#fff1f0;color:var(--red)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:760px){.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row>div:first-child{grid-column:1/-1}.actions{grid-column:1/-1}.top h1{font-size:25px}}</style></head><body><main class="wrap"><div class="top"><div><h1>Management Timesheets</h1><div class="sub">Home Comfort Cleaners LLC</div></div><button class="btn" id="back">Cleaner View</button></div><section class="stats"><div class="stat"><div class="lab">THIS WEEK</div><div id="weekHours" class="big">0.00 hrs</div></div><div class="stat"><div class="lab">OPEN SHIFTS</div><div id="openShifts" class="big">0</div></div><div class="stat"><div class="lab">NEEDS REVIEW</div><div id="reviewCount" class="big">0</div></div></section><div id="list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://zswjjqurxcknqidborlj.supabase.co','sb_publishable_ET7JL1dPhWgPb3rDhpS_zg_J2CjltGE');const OWNER='ceo@riversideluxeretreats.com';const list=document.getElementById('list');function fmt(x){return x?new Date(x).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Open'}function hours(r){if(!r.clock_out)return 0;return Math.max(0,(new Date(r.clock_out)-new Date(r.clock_in))/36e5-(r.break_minutes||0)/60)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const {data:{user}}=await sb.auth.getUser();if(!user||String(user.email).toLowerCase()!=OWNER){location.href='./';return}const {data,error}=await sb.from('time_entries').select('*').order('clock_in',{ascending:false}).limit(200);if(error){list.innerHTML='<div class="card">'+esc(error.message)+'</div>';return}const rows=data||[];const now=new Date(),start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));start.setHours(0,0,0,0);const week=rows.filter(r=>new Date(r.clock_in)>=start).reduce((a,r)=>a+hours(r),0);document.getElementById('weekHours').textContent=week.toFixed(2)+' hrs';document.getElementById('openShifts').textContent=rows.filter(r=>!r.clock_out).length;document.getElementById('reviewCount').textContent=rows.filter(r=>r.status==='needs_review').length;if(!rows.length){list.innerHTML='<div class="card empty">No timesheet records yet.</div>';return}list.innerHTML=rows.map(r=>{const st=r.approved?'approved':(r.status==='needs_review'?'review':'');const label=r.approved?'Approved':(r.status==='needs_review'?'Needs Review':r.status.replace('_',' '));return '<div class="card"><div class="row"><div><div class="name">'+esc(r.employee_name||r.employee_email)+'</div><div class="small">'+esc(r.employee_email)+'</div></div><div><div class="small">Clock in</div><div>'+fmt(r.clock_in)+'</div></div><div><div class="small">Clock out</div><div>'+fmt(r.clock_out)+'</div></div><div><div class="small">Hours</div><div><b>'+hours(r).toFixed(2)+'</b></div></div><div><span class="status '+st+'">'+esc(label)+'</span></div><div class="actions"><button class="approve" onclick="setStatus(\''+r.id+'\',\'approved\')">Approve</button><button class="flag" onclick="setStatus(\''+r.id+'\',\'needs_review\')">Needs Review</button></div></div></div>'}).join('')}async function setStatus(id,status){const patch=status==='approved'?{status:'approved',approved:true}:{status:'needs_review',approved:false};const {error}=await sb.from('time_entries').update(patch).eq('id',id);if(error)alert(error.message);else load()}document.getElementById('back').onclick=()=>location.href='./';load();</script></body></html>
