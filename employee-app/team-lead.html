<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Lead Dashboard</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;--bg:#f6f7f9;--line:#e5e7eb;--navy:#172033;--muted:#6b7280;--green:#139a69}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1f2937}.wrap{max-width:1000px;margin:auto;padding:22px 16px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:#111827;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.lab{font-size:11px;color:var(--muted);font-weight:850}.big{font-size:26px;font-weight:850;margin-top:6px}.muted{color:var(--muted);font-size:12px}.jobHead{display:flex;justify-content:space-between;gap:12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:11px;font-weight:850}.photos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.photoGroup{background:#f8fafc;border-radius:14px;padding:12px}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.reviewActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.approve,.flag{border:0;border-radius:10px;padding:10px 12px;font-weight:850}.approve{background:#e9f8f1;color:var(--green)}.flag{background:#fff7ed;color:#9a3412}.viewer{position:fixed;inset:0;background:#000c;z-index:100;display:grid;place-items:center;padding:18px}.viewer img{max-width:100%;max-height:90vh}.hidden{display:none!important}@media(max-width:700px){.stats,.photos{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1 id="heading"></h1><div id="sub" class="muted"></div></div><div class="actions"><button id="lang" class="btn"></button><a id="cleaner" class="btn" href="./"></a><a id="ownerLink" class="btn hidden" href="management.html"></a></div></div><section class="stats"><div class="stat"><div id="l1" class="lab"></div><div id="completed" class="big">0</div></div><div class="stat"><div id="l2" class="lab"></div><div id="needsReview" class="big">0</div></div><div class="stat"><div id="l3" class="lab"></div><div id="totalJobs" class="big">0</div></div></section><div id="jobs"></div></main><div id="viewer" class="viewer hidden" onclick="this.classList.add('hidden')"><img id="viewerImg"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://zswjjqurxcknqidborlj.supabase.co','sb_publishable_ET7JL1dPhWgPb3rDhpS_zg_J2CjltGE'),OWNER='ceo@riversideluxeretreats.com',$=x=>document.getElementById(x);let lang=localStorage.getItem('hcc_language')||'en';const T={en:{head:'Team Lead Dashboard',sub:'Quality control and cleaner job review',cleaner:'Cleaner View',mgmt:'Management',a:'AWAITING QUALITY REVIEW',n:'NEEDS REVIEW',q:'ACTIVE REVIEW QUEUE',loading:'Loading team jobs…',none:'No jobs waiting for quality review.',noPhotos:'No photos uploaded.',unavailable:'Photos unavailable.',unscheduled:'Not scheduled',unassigned:'Unassigned',job:'Cleaning Job',before:'Before',after:'After',approved:'✓ Quality Approved',follow:'↻ Needs Follow-Up'},es:{head:'Panel del Líder de Equipo',sub:'Control de calidad y revisión de trabajos de limpieza',cleaner:'Vista del Limpiador',mgmt:'Gerencia',a:'ESPERANDO REVISIÓN DE CALIDAD',n:'NECESITA REVISIÓN',q:'COLA ACTIVA DE REVISIÓN',loading:'Cargando trabajos del equipo…',none:'No hay trabajos esperando revisión de calidad.',noPhotos:'No se han subido fotos.',unavailable:'Fotos no disponibles.',unscheduled:'Sin horario',unassigned:'Sin asignar',job:'Trabajo de Limpieza',before:'Antes',after:'Después',approved:'✓ Calidad Aprobada',follow:'↻ Necesita Seguimiento'}};const tr=k=>T[lang][k];function ui(){localStorage.setItem('hcc_language',lang);document.documentElement.lang=lang;$('lang').textContent=lang==='en'?'🌐 Español':'🌐 English';$('heading').textContent=tr('head');$('sub').textContent=tr('sub');$('cleaner').textContent=tr('cleaner');$('ownerLink').textContent=tr('mgmt');$('l1').textContent=tr('a');$('l2').textContent=tr('n');$('l3').textContent=tr('q');load()}$('lang').onclick=()=>{lang=lang==='en'?'es':'en';ui()};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(x){return x?new Date(x).toLocaleString():tr('unscheduled')}function roleOf(u){if((u?.email||'').toLowerCase()===OWNER)return'owner';return (u?.user_metadata?.hcc_role||u?.user_metadata?.role||'cleaner').toLowerCase()==='team_lead'?'team_lead':'cleaner'}async function guard(){const {data:{user}}=await sb.auth.getUser(),r=roleOf(user);if(!user||!['owner','team_lead'].includes(r)){location.href='./';return false}if(r==='owner')$('ownerLink').classList.remove('hidden');return true}async function photoHtml(paths){if(!Array.isArray(paths)||!paths.length)return'<div class="muted">'+tr('noPhotos')+'</div>';const out=[];for(const p of paths){const {data,error}=await sb.storage.from('job-photos').createSignedUrl(p,3600);if(!error&&data?.signedUrl)out.push('<img class="thumb" src="'+esc(data.signedUrl)+'" onclick="openPhoto(this.src)">')}return out.length?out.join(''):'<div class="muted">'+tr('unavailable')+'</div>'}function openPhoto(src){$('viewerImg').src=src;$('viewer').classList.remove('hidden')}async function setReview(id,status){const {error}=await sb.from('jobs').update({status}).eq('id',id);if(error)alert(error.message);else load()}async function load(){if(!await guard())return;$('jobs').innerHTML='<div class="card">'+tr('loading')+'</div>';const {data,error}=await sb.from('jobs').select('*').in('status',['completed','needs_review']).order('scheduled_at',{ascending:true});if(error){$('jobs').innerHTML='<div class="card">'+esc(error.message)+'</div>';return}const rows=data||[];$('completed').textContent=rows.filter(r=>r.status==='completed').length;$('needsReview').textContent=rows.filter(r=>r.status==='needs_review').length;$('totalJobs').textContent=rows.length;if(!rows.length){$('jobs').innerHTML='<div class="card">'+tr('none')+'</div>';return}const cards=[];for(const j of rows){const before=await photoHtml(j.before_photos),after=await photoHtml(j.after_photos);cards.push('<div class="card"><div class="jobHead"><div><h3>'+esc(j.title||tr('job'))+'</h3><div class="muted">'+esc(j.assigned_name||j.assigned_email||tr('unassigned'))+' · '+esc(fmt(j.scheduled_at))+'</div><div class="muted">'+esc(j.address||'')+'</div></div><span class="badge">'+esc(j.status||'completed')+'</span></div><div class="photos"><div class="photoGroup"><h4>📸 '+tr('before')+'</h4><div class="thumbs">'+before+'</div></div><div class="photoGroup"><h4>✨ '+tr('after')+'</h4><div class="thumbs">'+after+'</div></div></div><div class="reviewActions"><button class="approve" onclick="setReview(\''+j.id+'\',\'quality_approved\')">'+tr('approved')+'</button><button class="flag" onclick="setReview(\''+j.id+'\',\'needs_review\')">'+tr('follow')+'</button></div></div>')}$('jobs').innerHTML=cards.join('')}ui();</script></body></html>
