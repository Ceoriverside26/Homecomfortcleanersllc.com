<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Jobs</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;--bg:#f6f7f9;--line:#e5e7eb;--navy:#172033;--muted:#6b7280;--green:#139a69;--amber:#92400e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1f2937}.wrap{max-width:900px;margin:auto;padding:22px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}.back{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-decoration:none;color:#111827;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:11px;font-weight:850;color:var(--muted);margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:90px}.full{grid-column:1/-1}.save{width:100%;border:0;border-radius:11px;background:var(--navy);color:#fff;padding:13px;font-weight:850;margin-top:14px}.msg{margin-top:10px;color:var(--green);font-weight:750}.job{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:10px;align-items:center}.muted{color:var(--muted);font-size:12px}.badge{display:inline-block;background:#eef2ff;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.unassigned{background:#fff7ed;color:var(--amber)}.assignRow{display:flex;gap:7px;margin-top:8px}.assignRow select{padding:8px;font-size:12px}.assignBtn{border:0;border-radius:9px;background:var(--navy);color:#fff;padding:8px 10px;font-weight:800;font-size:12px}@media(max-width:650px){.grid,.job{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><div class="top"><div><h1>Manage Jobs</h1><div class="muted">Create, review and assign cleaner jobs</div></div><a class="back" href="management.html">Timesheets</a></div><section class="card"><h2>New Job</h2><div class="grid"><div class="full"><label>JOB TITLE</label><input id="title" placeholder="Example: Move-out cleaning"></div><div><label>SERVICE TYPE</label><select id="service"><option>Residential Cleaning</option><option>Commercial Cleaning</option><option>Deep Clean</option><option>Move-in / Move-out</option><option>Airbnb / Turnover</option><option>Recurring Cleaning</option></select></div><div><label>ASSIGN CLEANER</label><select id="cleaner"><option value="" data-name="">Unassigned — assign later</option><option value="yessicabrooks24@gmail.com" data-name="Yessica Brooks">Yessica Brooks</option><option value="ceo@riversideluxeretreats.com" data-name="Philip Brooks">Philip Brooks</option></select></div><div><label>DATE & TIME</label><input id="schedule" type="datetime-local"></div><div><label>ADDRESS</label><input id="address" placeholder="Service address"></div><div class="full"><label>CLEANER INSTRUCTIONS</label><textarea id="instructions" placeholder="Entry instructions, cleaning notes, checklist details..."></textarea></div></div><button id="save" class="save">Create Job</button><div id="msg" class="msg"></div></section><h2>All Jobs</h2><div id="jobs"><div class="card">Loading jobs…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://zswjjqurxcknqidborlj.supabase.co','sb_publishable_ET7JL1dPhWgPb3rDhpS_zg_J2CjltGE'),OWNER='ceo@riversideluxeretreats.com';const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(x){return x?new Date(x).toLocaleString():'Not scheduled'}async function guard(){const {data:{user}}=await sb.auth.getUser();if(!user||user.email.toLowerCase()!==OWNER){location.href='./';return false}return true}function assignmentControl(j){const current=(j.assigned_email||'').toLowerCase();return '<div><b>'+(j.assigned_name?esc(j.assigned_name):'<span class="badge unassigned">Unassigned</span>')+'</b><div class="muted">'+esc(fmt(j.scheduled_at))+'</div><div class="assignRow"><select id="a-'+j.id+'"><option value=""'+(!current?' selected':'')+'>Unassigned</option><option value="yessicabrooks24@gmail.com"'+(current==='yessicabrooks24@gmail.com'?' selected':'')+'>Yessica Brooks</option><option value="ceo@riversideluxeretreats.com"'+(current===OWNER?' selected':'')+'>Philip Brooks</option></select><button class="assignBtn" onclick="assignJob(\''+j.id+'\')">Assign</button></div></div>'}async function load(){if(!await guard())return;const {data,error}=await sb.from('jobs').select('*').order('scheduled_at',{ascending:true});if(error){$('jobs').innerHTML='<div class="card">'+esc(error.message)+'</div>';return}const rows=data||[];$('jobs').innerHTML=rows.length?rows.map(j=>'<div class="card job"><div><b>'+esc(j.title)+'</b><div class="muted">'+esc(j.service_type||'')+' · '+esc(j.address||'')+'</div></div>'+assignmentControl(j)+'<div><span class="badge">'+esc(j.status)+'</span></div></div>').join(''):'<div class="card">No jobs yet.</div>'}window.assignJob=async id=>{if(!await guard())return;const s=$('a-'+id),email=s.value,name=email==='yessicabrooks24@gmail.com'?'Yessica Brooks':email===OWNER?'Philip Brooks':null;const {error}=await sb.from('jobs').update({assigned_email:email||null,assigned_name:name}).eq('id',id);if(error){alert('Could not assign job: '+error.message);return}load()};$('save').onclick=async()=>{if(!await guard())return;const c=$('cleaner'),email=c.value,name=c.options[c.selectedIndex].dataset.name||null,title=$('title').value.trim(),address=$('address').value.trim();if(!title||!address){$('msg').textContent='Enter a job title and address.';return}const row={title,service_type:$('service').value,assigned_email:email||null,assigned_name:name,address,instructions:$('instructions').value.trim(),scheduled_at:$('schedule').value?new Date($('schedule').value).toISOString():null,status:'assigned'};const {error}=await sb.from('jobs').insert(row);if(error){$('msg').textContent='Could not create job: '+error.message;return}$('msg').textContent=email?'Job created and assigned to '+name+'.':'Job created as Unassigned.';$('title').value='';$('address').value='';$('instructions').value='';$('schedule').value='';$('cleaner').value='';load()};load();</script></body></html>
